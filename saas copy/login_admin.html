<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - SaaS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: #fff; width: 100%; max-width: 420px; padding: 40px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .login-box h2 { color: #1e293b; font-size: 24px; margin-bottom: 5px; text-align: center; }
        .login-box p { color: #64748b; font-size: 14px; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #334155; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; transition: border 0.2s; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn-submit { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Painel Corporativo</h2>
        <p>Acesse a gestão do seu estabelecimento</p>

        <form id="form-login-admin">
            <div class="form-group">
                <label for="admin-email">E-mail Administrativo:</label>
                <input type="email" id="admin-email" required placeholder="seuemail@empresa.com">
            </div>
            
            <div class="form-group">
                <label for="admin-senha">Senha de Acesso:</label>
                <input type="password" id="admin-senha" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Entrar no Sistema</button>
        </form>
    </div>

    <script src="js/login_admin.js"></script>
</body>
</html>
