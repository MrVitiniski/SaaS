<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Cliente</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc;">
        <h2>Criar Nova Conta</h2>
        <p id="nome-estabelecimento-registro">Carregando...</p> 

        <form id="form-registro">
            <div>
                <label>Nome Completo:</label>
                <input type="text" id="registro-nome" required style="width: 100%; margin-bottom: 10px;">
            </div>
            <div>
                <label>E-mail:</label>
                <input type="email" id="registro-email" required style="width: 100%; margin-bottom: 10px;">
            </div>
            <div>
                <label>Telefone / WhatsApp:</label>
                <input type="text" id="registro-telefone" placeholder="(00) 00000-0000" style="width: 100%; margin-bottom: 10px;">
            </div>
            <div>
                <label>Senha:</label>
                <input type="password" id="registro-senha" required style="width: 100%; margin-bottom: 10px;">
            </div>
            <div>
                <label>Confirme a Senha:</label>
                <input type="password" id="registro-confirmar-senha" required style="width: 100%; margin-bottom: 15px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; margin-bottom: 10px;">Cadastrar</button>
        </form>
        <p style="text-align: center; font-size: 14px;">
            Já tem uma conta? <a href="#" onclick="window.location.href='login.html'+window.location.search">Faça login aqui</a>
        </p>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
