<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="grid w-full gap-8 rounded-[2rem] border border-slate-800 bg-slate-900/70 p-6 shadow-2xl shadow-slate-950/30 lg:grid-cols-2 lg:p-10">
      <section class="space-y-6 rounded-[1.5rem] bg-gradient-to-br from-emerald-500 to-slate-900 p-8">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.3em] text-emerald-100/80">Cadastro do cliente</p>
          <h1 class="mt-4 text-3xl font-black leading-tight">Crie sua conta para agendar e acompanhar tudo com facilidade.</h1>
          <p class="mt-4 text-sm text-emerald-100/80">Seu cadastro fica vinculado ao estabelecimento atual, mantendo o acesso seguro e separado entre empresas.</p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/10 p-4">
          <p class="text-xs uppercase tracking-[0.3em] text-emerald-100/70">Estabelecimento</p>
          <p id="nome-estabelecimento-registro" class="mt-2 text-xl font-semibold">Carregando...</p>
        </div>
      </section>

      <section class="flex flex-col justify-center">
        <div id="registro-feedback" class="hidden mb-4 rounded-2xl border px-4 py-3 text-sm"></div>
        <form id="form-registro" class="space-y-4" novalidate>
          <div>
            <label for="registro-nome" class="mb-2 block text-sm font-medium text-slate-200">Nome</label>
            <input type="text" id="registro-nome" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/40" placeholder="Seu nome completo" autocomplete="name">
          </div>
          <div>
            <label for="registro-email" class="mb-2 block text-sm font-medium text-slate-200">E-mail</label>
            <input type="email" id="registro-email" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/40" placeholder="voce@exemplo.com" autocomplete="email">
          </div>
          <div>
            <label for="registro-telefone" class="mb-2 block text-sm font-medium text-slate-200">Telefone</label>
            <input type="tel" id="registro-telefone" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/40" placeholder="(00) 00000-0000" autocomplete="tel" inputmode="tel">
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="registro-senha" class="mb-2 block text-sm font-medium text-slate-200">Senha</label>
              <input type="password" id="registro-senha" required minlength="6" class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/40" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
            </div>
            <div>
              <label for="registro-confirmar-senha" class="mb-2 block text-sm font-medium text-slate-200">Confirmar Senha</label>
              <input type="password" id="registro-confirmar-senha" required minlength="6" class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/40" placeholder="Repita a senha" autocomplete="new-password">
            </div>
          </div>
          <button id="btn-submit-registro" type="submit" class="w-full rounded-2xl bg-emerald-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-70">Criar conta</button>
        </form>

        <div class="mt-6 flex flex-col gap-3 text-sm text-slate-400 sm:flex-row sm:items-center sm:justify-between">
          <a id="link-login" href="login.html" class="font-medium text-emerald-300 transition hover:text-emerald-200">Já tem uma conta? Voltar ao login</a>
          <a href="index.html" class="font-medium text-slate-300 transition hover:text-white">Voltar ao início</a>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
