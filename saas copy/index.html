<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agendamento Online</title>
  <meta name="description" content="Agendamento online de serviços com seleção de serviço, profissional, data e horário." />

  <!-- Otimização de conexão -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="dns-prefetch" href="//cdn.tailwindcss.com" />

  <!-- Tailwind CDN (correto para dev) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col justify-between bg-slate-50 text-slate-800 font-sans antialiased">
  <!-- Header / Identificação da Empresa -->
  <header class="bg-white border-b border-slate-200 py-6 text-center">
    <h1 id="tenant-name" class="text-2xl font-bold text-indigo-600">Carregando estabelecimento...</h1>
    <p class="mt-1 text-sm text-slate-500">Escolha os detalhes abaixo para reservar seu horário</p>
  </header>

  <!-- Conteúdo Principal / Formulário de Agendamento -->
  <main class="w-full max-w-xl mx-auto p-4 my-auto">
    <form id="form-agendamento" class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 space-y-6" novalidate>
      
      <!-- Passo 1: Selecionar Serviço (Carregado dinamicamente via banco) -->
      <section id="bloco-servicos">
        <label for="select-servico" class="block text-sm font-semibold text-slate-700 mb-2">
          1. Escolha o Serviço
        </label>
        <select
          id="select-servico"
          name="servico"
          class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
          required
          autocomplete="off"
        >
          <option value="">Carregando serviços disponíveis...</option>
        </select>
      </section>

      <!-- NOVO PASSO: Selecionar Produto Adicional (Inicia oculto, aparece dinamicamente via JS) -->
      <section id="bloco-produtos" class="hidden">
        <label for="select-produto" class="block text-sm font-semibold text-slate-700 mb-2">
          (Opcional) Adicionar produtos à sua reserva
        </label>
        <select
          id="select-produto"
          name="produto"
          class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
          autocomplete="off"
        >
          <option value="">Deseja levar algum item junto?</option>
        </select>
      </section>

      <!-- Passo 2: Selecionar Profissional (Carregado dinamicamente via banco) -->
      <section id="bloco-profissionais">
        <label for="select-profissional" class="block text-sm font-semibold text-slate-700 mb-2">
          2. Escolha o Profissional / Atendente
        </label>
        <select
          id="select-profissional"
          name="profissional"
          class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
          required
          autocomplete="off"
        >
          <option value="">Selecione quem irá te atender...</option>
          <option value="1">Carlos Souza</option>
          <option value="2">Ana Beatriz</option>
        </select>
      </section>

      <!-- Passo 3 e 4: Data e Hora -->
      <section class="grid grid-cols-2 gap-4">
        <div>
          <label for="input-data" class="block text-sm font-semibold text-slate-700 mb-2">3. Data</label>
          <input
            type="date"
            id="input-data"
            name="data"
            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
            required
          />
        </div>

        <div>
          <label for="input-hora" class="block text-sm font-semibold text-slate-700 mb-2">4. Horário</label>
          <input
            type="time"
            id="input-hora"
            name="hora"
            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
            required
          />
        </div>
      </section>

      <!-- Passo 5: Dados do Cliente -->
      <section class="border-t border-slate-100 pt-4 space-y-4">
        <h2 class="text-sm font-semibold text-slate-700">5. Seus Dados</h2>

        <div>
          <label for="cliente-nome" class="sr-only">Seu nome completo</label>
          <input
            type="text"
            id="cliente-nome"
            name="cliente_nome"
            placeholder="Seu nome completo"
            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
            required
            autocomplete="name"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="cliente-telefone" class="sr-only">WhatsApp</label>
            <input
              type="tel"
              id="cliente-telefone"
              name="cliente_telefone"
              placeholder="WhatsApp (DDD + Número)"
              class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
              required
              autocomplete="tel"
              inputmode="tel"
            />
          </div>

          <div>
            <label for="cliente-email" class="sr-only">E-mail</label>
            <input
              type="email"
              id="cliente-email"
              name="cliente_email"
              placeholder="E-mail (opcional)"
              class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block p-3 outline-none"
              autocomplete="email"
            />
          </div>
        </div>
      </section>

      <!-- Botão de Confirmação -->
      <button
        type="submit"
        class="w-full text-white bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-xl text-sm px-5 py-4 text-center transition-all shadow-md shadow-indigo-200 active:scale-[0.98] cursor-pointer"
      >
        Confirmar Agendamento
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-100 bg-white">
    &copy; 2026 SaaS Multi-Modular. Todos os direitos reservados.
  </footer>

  <!-- Roteador do SaaS e Script de Agendamento -->
  <script src="js/SaaSRouter.js"></script>
  <script src="js/agendamento.js" defer></script>
</body>
</html>
